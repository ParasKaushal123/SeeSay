[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-evidence"
version = "0.1.0"
description = "Lightweight finding probes and calibrated evidence fusion for CXR reports"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "lightgbm>=4.3,<5",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
generation = [
    "torch",
    "transformers",
    "accelerate",
    "bitsandbytes",
    "pillow",
]

[project.scripts]
cxr-evidence = "cxr_evidence.cli:main"
cxr-report = "cxr_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
